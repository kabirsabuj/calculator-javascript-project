
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>
<body>

    <main class="page-container">

        <div class="calculator">

            <header class="calculator-header">
                <div class="brand">
                    <div class="brand-icon">✦</div>
                    <div>
                        <h1>Calculator</h1>
                        <p>SMART & SIMPLE</p>
                    </div>
                </div>

                <div class="status-dot" title="Calculator ready"></div>
            </header>

            <section class="display" aria-label="Calculator display">
                <div class="history" id="history">Ready to calculate</div>
                <output class="result" id="result" aria-live="polite">0</output>
            </section>

            <section class="keypad" aria-label="Calculator buttons">

                <button class="key function" data-action="clear">AC</button>
                <button class="key function" data-action="sign">+/−</button>
                <button class="key function" data-action="percent">%</button>
                <button class="key operator" data-operator="÷">÷</button>

                <button class="key number" data-number="7">7</button>
                <button class="key number" data-number="8">8</button>
                <button class="key number" data-number="9">9</button>
                <button class="key operator" data-operator="×">×</button>

                <button class="key number" data-number="4">4</button>
                <button class="key number" data-number="5">5</button>
                <button class="key number" data-number="6">6</button>
                <button class="key operator" data-operator="−">−</button>

                <button class="key number" data-number="1">1</button>
                <button class="key number" data-number="2">2</button>
                <button class="key number" data-number="3">3</button>
                <button class="key operator" data-operator="+">+</button>

                <button class="key delete" data-action="delete">DEL</button>
                <button class="key number" data-number="0">0</button>
                <button class="key number" data-action="decimal">.</button>
                <button class="key equal" data-action="equals">=</button>

            </section>

            <footer class="calculator-footer">
                <span>●</span> Designed for everyday math
            </footer>

        </div>

        <p class="page-caption">MAKE EVERY CALCULATION SIMPLE.</p>

    </main>

</body>
</html>
